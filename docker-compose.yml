version: '3.8'

services:
  # Шина событий для асинхронного взаимодействия
  rabbitmq:
    image: rabbitmq:3-management
    container_name: dio_message_broker
    ports:
      - "5672:5672"   # AMQP порт
      - "15672:15672" # Веб-интерфейс управления (guest/guest)

  # Основное хранилище (Write/Read Model)
  postgres:
    image: postgres:15-alpine
    container_name: dio_db_orders
    environment:
      POSTGRES_USER: dio_admin
      POSTGRES_PASSWORD: dio_password
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
